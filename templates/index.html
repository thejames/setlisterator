{% extends "base.html" %}
{% block content %}
<div style="max-width:560px;margin:7vh auto 0;">
  <div class="panel" style="padding:28px 26px">
    <form method="post" action="{{ url_for('builder_seed') }}"
          data-loading="Building…">
      <label>Seed from a setlist.fm show <span style="font-weight:400;color:var(--faint)">(optional)</span>
        <input name="setlist" autofocus
               placeholder="https://www.setlist.fm/…  or  6b756686">
      </label>
      <label>Playlist name <span style="font-weight:400;color:var(--faint)">(optional)</span>
        <input name="name" placeholder="auto-generated, or name your own">
      </label>
      <button type="submit" class="btn-accent" style="margin-top:8px">Open builder →</button>
    </form>
  </div>
  <p class="hint" style="margin-top:16px;text-align:center">Seed from a show to
    start with its songs matched, or leave it blank to build from scratch — then
    search, arrange, and save. Nothing is created until you hit Save.</p>
</div>
{% endblock %}
