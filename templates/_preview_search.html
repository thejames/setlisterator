{# Library search results for one setlist slot. "Use" fills/replaces slot `pos`. #}
{% if results %}
<ul class="results-list">
  {% for r in results %}
  <li>
    <span class="tmeta">
      <span class="trunc ttitle">{{ r.title or "(untitled)" }}</span>
      <span class="trunc sub">{{ r.artist }}{% if r.album %} · {{ r.album }}{% endif %}</span>
    </span>
    <form hx-post="{{ url_for('preview_resolve', draft_id=draft.id) }}"
          hx-target="#preview-rows" hx-swap="outerHTML" class="addform">
      <input type="hidden" name="pos" value="{{ pos }}">
      <input type="hidden" name="track_id" value="{{ r.track_id }}">
      <input type="hidden" name="title" value="{{ r.title }}">
      <input type="hidden" name="artist" value="{{ r.artist }}">
      <input type="hidden" name="album" value="{{ r.album }}">
      <button type="submit" class="btn-add">Use</button>
    </form>
  </li>
  {% endfor %}
</ul>
{% else %}
<p class="hint" style="margin-top:8px">No matches.</p>
{% endif %}
